name: Playwright Cross-Browser Automation

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  smoke-tests:
    name: Cross-Browser Smoke Suite
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      SAUCE_USER: ${{ secrets.SAUCE_USER }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: npx playwright test --project=${{ matrix.browser }} --grep @smoke

      - name: Upload Smoke Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  regression-tests:
    name: Full Regression Suite
    needs: smoke-tests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    env:
      SAUCE_USER: ${{ secrets.SAUCE_USER }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run regression tests
        run: npx playwright test --grep @regression

      - name: Upload Regression Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression-report
          path: playwright-report/
          retention-days: 30
